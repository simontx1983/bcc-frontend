name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Frontend — tsc · lint · vitest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npx next lint

      # Dead-file guard — fails the build on any orphaned source file (a
      # component/module nothing imports or renders). File-level only
      # (mirrors the PHP dead-file-scan); unused *exports* are reported by
      # a bare `npx knip` locally but not gated here. Config + ignores
      # (e.g. the runtime-registered public/sw.js) live in knip.json.
      - name: Dead-file guard (knip)
        run: npx knip --include files

      - name: Unit tests
        run: npx vitest run

      # Production build is validated by Vercel on every push + PR preview
      # deploy (the optional native-binary deps make `next build` flaky to
      # reproduce on a clean GH runner from a Windows-generated lockfile).
